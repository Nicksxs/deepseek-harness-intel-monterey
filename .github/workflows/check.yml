name: Check adapter
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bootstrap:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: /bin/bash -n Setup-Intel-Monterey.command
      - name: Test default shell and prerequisite errors
        run: |
          /bin/bash --version
          python3 tests/test_shell_guards.py
      - name: Download pinned upstream fixture
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 --retry 2 --max-time 180 \
            https://github.com/deepseek-ai/deepseek-harness/archive/639ed015397290b3745d163aafe02ffee4aa3f84.tar.gz \
            -o "$RUNNER_TEMP/upstream.tar.gz"
      - name: Test archive verification and patch bootstrap
        run: python3 tests/test_bootstrap.py "$RUNNER_TEMP/upstream.tar.gz"
